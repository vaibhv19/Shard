[project]
name = "shard"
version = "0.1.0"
description = "GIL-conscious distributed cache in Python/Django"
authors = [
    {name = "Portfolio Owner", email = "owner@example.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<6.0",
    "djangorestframework>=3.15.0,<3.16.0",
    "prometheus-client>=0.20.0,<0.21.0"
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0"
]

[tool.poetry]
# We include this block for Poetry compatibility
packages = [
    { include = "engine" },
    { include = "cache_app" }
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "shard_project.settings"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
